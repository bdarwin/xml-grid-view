name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vitest (unit + golden fixtures)
        run: pnpm test
      - name: Golden fixtures are up to date (never regenerated in CI)
        run: pnpm fixtures:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build core, webview and the VS Code .vsix
        run: pnpm build
      - name: VS Code smoke test
        run: xvfb-run -a pnpm --filter xml-grid-view-plus test
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: packages/vscode/*.vsix

  visual:
    # Screenshot tests of the web view, in the same image `pnpm visual` uses locally.
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the web view
        run: pnpm --filter @xmlgridview/webview build
      - name: Screenshot tests
        run: pnpm --filter @xmlgridview/webview visual:ci
        env:
          CI: "1"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: visual-diffs
          path: |
            packages/webview/test-results/visual
            packages/webview/test-results/visual-report

  intellij:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/intellij
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: JUnit (golden fixtures + light UI tests)
        run: ./gradlew test --no-daemon
      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: intellij-test-reports
          path: |
            packages/intellij/build/reports/tests
            packages/intellij/build/reports/visual
      - uses: actions/upload-artifact@v7
        with:
          name: intellij-plugin
          path: packages/intellij/build/distributions/*.zip
