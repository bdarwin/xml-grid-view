name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vitest (unit + golden fixtures)
        run: pnpm test
      - name: Golden fixtures are up to date (never regenerated in CI)
        run: pnpm fixtures:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build core, webview and the VS Code .vsix
        run: pnpm build
      - name: VS Code smoke test
        run: xvfb-run -a pnpm --filter xml-grid-view test
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: packages/vscode/*.vsix

  intellij:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/intellij
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: JUnit (golden fixtures + light UI tests)
        run: ./gradlew test --no-daemon
      - name: Build plugin
        run: ./gradlew buildPlugin --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: intellij-test-reports
          path: packages/intellij/build/reports/tests
      - uses: actions/upload-artifact@v4
        with:
          name: intellij-plugin
          path: packages/intellij/build/distributions/*.zip
